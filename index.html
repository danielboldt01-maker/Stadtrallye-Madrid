<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Selbstgeführte Stadtrallye durch Lavapiés und das Barrio de las Letras in Madrid: 10 Kulturstationen, 4 Bars, rund 3 Stunden.">
<meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23b8321d'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='%23fff' font-family='system-ui,sans-serif'%3EM%3C/text%3E%3C/svg%3E">
<title>Madrid-Rallye: Lavapiés und Barrio de las Letras</title>
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --text:#1d1915; --muted:#655d54;
  --accent:#b8321d; --accent-ink:#ffffff; --line:#e4dccf; --bar:#1f6f78;
  --ok:#1c6b3f; --ok-bg:#e6f4ea; --warn:#8a4b00; --warn-bg:#fbf0dd;
  --shadow:0 1px 2px rgba(29,25,21,.06), 0 6px 20px rgba(29,25,21,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --card:#221e19; --text:#f3eee6; --muted:#aaa194;
    --accent:#ff7a5c; --accent-ink:#2b0a02; --line:#3a332b; --bar:#6fcbd4;
    --ok:#7fd9a4; --ok-bg:#17301f; --warn:#f0c07a; --warn-bg:#332614;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --card:#221e19; --text:#f3eee6; --muted:#aaa194;
  --accent:#ff7a5c; --accent-ink:#2b0a02; --line:#3a332b; --bar:#6fcbd4;
  --ok:#7fd9a4; --ok-bg:#17301f; --warn:#f0c07a; --warn-bg:#332614;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.55; overscroll-behavior-y:contain; -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
img{max-width:100%}
.topbar{
  position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.topbar-label{font-size:13px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
.dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end}
.dot{width:9px; height:9px; border-radius:50%; background:var(--line)}
.dot.bar{border-radius:2px}
.dot.done{background:var(--accent)}
.dot.bar.done{background:var(--bar)}
.dot.now{background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
.dot.bar.now{background:var(--bar); box-shadow:0 0 0 3px color-mix(in srgb, var(--bar) 25%, transparent)}
main{
  padding:20px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 112px) calc(env(safe-area-inset-left) + 16px);
  max-width:560px; margin:0 auto;
}
.eyebrow{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 6px}
h1{font-size:30px; line-height:1.2; margin:0 0 10px; letter-spacing:-.01em}
h2{font-size:24px; line-height:1.25; margin:0 0 12px; letter-spacing:-.01em}
h3{font-size:17px; margin:0 0 6px}
p{margin:0 0 14px}
.lead{font-size:18px; color:var(--muted)}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:0 0 16px; box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card > :last-child{margin-bottom:0}
.meta{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; padding:0; list-style:none}
.meta li{font-size:14px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; color:var(--muted)}
.aufgabe{background:var(--card); border:2px solid var(--accent); border-radius:16px; padding:18px; margin:0 0 16px; box-shadow:var(--shadow)}
.aufgabe.planb{border-style:dashed}
.aufgabe > :last-child{margin-bottom:0}
.feedback{border-radius:12px; padding:12px 14px; margin:0 0 14px; font-size:16px}
.feedback.ok{background:var(--ok-bg); color:var(--ok); border:1px solid color-mix(in srgb, var(--ok) 35%, transparent)}
.feedback.no{background:var(--warn-bg); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent)}
.feedback > :last-child{margin-bottom:0}
.letter{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 18px; margin:0 0 16px}
.letter .big{font-size:40px; font-weight:800; line-height:1; color:var(--accent); width:56px; height:56px; display:grid; place-items:center; flex:0 0 auto; border:2px dashed var(--accent); border-radius:12px}
.letter .txt{font-size:15px; color:var(--muted)}
.sammlung{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; padding:0; list-style:none}
.sammlung li{width:30px; height:40px; display:grid; place-items:center; border-radius:8px; border:2px solid var(--line); color:var(--muted); font-size:19px; font-weight:800; background:var(--card)}
.sammlung li.have{border-color:var(--accent); color:var(--accent)}
.bild{margin:0 0 16px}
.bild img{display:block; width:100%; height:auto; border-radius:14px; background:var(--line)}
.bild figcaption{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4}
.bild.fehlt img{display:none}
.bild.fehlt::before{content:"Foto folgt (Platzhalter)"; display:grid; place-items:center; height:160px; border-radius:14px; border:2px dashed var(--line); color:var(--muted); font-size:15px}
label.fieldlabel{display:block; font-size:14px; font-weight:600; color:var(--muted); margin:0 0 6px}
input[type="text"]{width:100%; font-size:16px; font-family:inherit; padding:14px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--text); min-height:52px}
input[type="text"]:focus{outline:none; border-color:var(--accent)}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:52px; padding:14px 18px; border-radius:14px; border:2px solid transparent; font-size:17px; font-weight:650; font-family:inherit; text-decoration:none; cursor:pointer; -webkit-tap-highlight-color:transparent; text-align:center}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.secondary{background:var(--card); color:var(--text); border-color:var(--line)}
.btn.ghost{background:transparent; color:var(--muted); min-height:44px; font-size:15px; font-weight:600}
.btn:active{transform:translateY(1px)}
.btn + .btn{margin-top:10px}
.actions{position:fixed; left:0; right:0; bottom:0; z-index:10; padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px); background:var(--bg); border-top:1px solid var(--line); box-shadow:0 -10px 18px -10px rgba(0,0,0,.18)}
.actions-inner{max-width:560px; margin:0 auto}
.inline-actions{margin:0 0 16px}
.hidden{display:none !important}
.footnote, .klein{font-size:14px; color:var(--muted)}
.footnote{margin:22px 0 0}
.footnote a, .card a:not(.btn){color:var(--accent)}
ol.regeln{margin:0; padding-left:22px}
ol.regeln li{margin:0 0 10px}
.sterne{font-size:22px; letter-spacing:2px; color:var(--accent)}
table.auswertung{width:100%; border-collapse:collapse; font-size:15px}
table.auswertung td{padding:8px 0; border-bottom:1px solid var(--line); vertical-align:top}
table.auswertung tr:last-child td{border-bottom:none}
table.auswertung td:last-child{text-align:right; white-space:nowrap; padding-left:10px; font-size:17px}
</style>
</head>
<body>
<div class="topbar hidden" id="topbar">
  <div class="topbar-row">
    <span class="topbar-label" id="topbarLabel">Madrid-Rallye</span>
    <div class="dots" id="dots"></div>
  </div>
</div>
<main id="app"></main>
<div class="actions" id="actions"><div class="actions-inner" id="actionsInner"></div></div>
<script>
"use strict";
/* ============================================================
   INHALTE — alles, was die Rallye erzählt und fragt, steht hier.
   Lösungen stehen bewusst im Klartext; wer mitspielt, schaut nicht in den Quelltext.
   typ: "kultur" (Pflichtaufgabe, liefert Sammelbuchstaben) | "bar" (Bonusfrage, freiwillig)
   planB: Ersatzaufgabe, falls das Objekt verdeckt, eingerüstet oder verschwunden ist.
   ============================================================ */
const RALLYE = {
  titel: "Madrid-Rallye",
  untertitel: "Von Lavapiés ins Barrio de las Letras: Barock, Corralas, Dichterhäuser und vier Bars.",
  eckdaten: ["14 Stationen", "10 × Kultur, 4 × Bar", "3,1 km zu Fuß", "ca. 3 Stunden", "2–3 Personen"],
  regeln: [
    "Pro Station gibt es drei Schritte: den Weg, den Ort mit Foto und Geschichte und dann die Aufgabe.",
    "Jede Antwort steht <strong>vor Ort</strong>: ablesen, zählen, erkennen. Googeln hilft nicht, Hinschauen schon.",
    "Nach zwei Fehlversuchen gibt es einen Tipp, nach vieren die Lösung.",
    "Jede Kulturstation liefert einen Sammelbuchstaben. Am Ende ergeben alle zusammen das Schlusswort.",
    "Bei den Bars ist die Bonusfrage freiwillig. Erst bestellen, dann rätseln.",
    "Ist ein Objekt eingerüstet oder verschwunden? Dann tippt auf „Objekt nicht zu finden?“, und ihr bekommt eine Ersatzaufgabe."
  ],
  start: {
    adresse: "Calle de Buenavista 20, 28012 Madrid",
    text: "Calle de Buenavista 20, nahe der Kreuzung mit der Calle de la Torrecilla del Leal (Lavapiés). Ladet die Seite einmal komplett, dann läuft sie auch bei schlechtem Netz. Der Fortschritt bleibt auf diesem Handy gespeichert."
  },
  hinweis: "Bequeme Schuhe, ein geladenes Handy, Bargeld für die Tabernas, und los. Samstags ab 13 Uhr haben alle Bars am Weg geöffnet.",

  stationen: [
    {
      typ: "kultur", buchstabe: "S",
      name: "Plaza de Lavapiés",
      adresse: "Plaza de Lavapiés, 28012 Madrid",
      meter: 274, minuten: 4,
      weg: "Geht die Calle de Buenavista nach Südwesten bis zu ihrem Ende an der Calle del Doctor Piga (rund 150 m). Dort rechts in die Calle de la Fe und ihr rund 70 m folgen. Dann öffnet sich vor euch die Plaza de Lavapiés.",
      bild: { src: "bilder/01-lavapies.jpg", w: 1024, h: 768, alt: "Das moderne Teatro Valle-Inclán an der Plaza de Lavapiés am Abend",
              credit: "Teatro Valle-Inclán / Centro Dramático Nacional · Foto: tnarik, Flickr, CC BY-SA 2.0" },
      info: [
        "„Lavapiés“ heißt wörtlich „wasch die Füße“. Woher der Name kommt, weiß niemand sicher. Die schönste Legende erzählt von einem Brunnen, an dem man sich vor dem Betreten des alten Viertels die Füße wusch. Sicher ist: Hier stand bis ins späte 19. Jahrhundert ein öffentlicher Brunnen. Wasserträger, die <em>aguadores</em>, füllten dort ihre Gefäße und schleppten das Wasser in die Häuser.",
        "Heute ist Lavapiés das vielsprachigste Viertel Madrids. Den Platz beherrscht das kantige Teatro Valle-Inclán des Nationalen Dramenzentrums, gebaut auf dem Grundstück eines alten Kinos. Der Komponist Isaac Albéniz hat dem Viertel ein Klavierstück gewidmet, eine Tafel am Platz erinnert daran."
      ],
      aufgabe: "Madrid beschriftet die Straßen seiner Altstadt mit bemalten Kachelbildern. Sucht an den Hauswänden rund um den Platz das Kachelschild <strong>„Plaza de Lavapiés“</strong>. Es zeigt den alten Brunnen. <strong>Wie viele Holzfässer sind auf dem Bild zu sehen?</strong>",
      antworten: ["5", "fünf", "funf", "cinco", "5 fässer", "fünf fässer"],
      tipp: "Die Schilder hängen an den Hausecken etwa in Höhe des ersten Stocks. Zählt jedes Fass: am Boden, auf einer Schulter und neben dem sitzenden Jungen.",
      loesung: "5 Fässer: eins unten links, eins auf der Schulter des Jungen, eins neben dem sitzenden Jungen und zwei rechts. Darin brachten die Wasserträger das Brunnenwasser in die Häuser.",
      planB: {
        aufgabe: "Kein Kachelschild zu finden? Sucht am Platz die Gedenktafel für den Komponisten <strong>Isaac Albéniz</strong>. Sie nennt sein Stück „Lavapiés“. <strong>Zu welcher Suite gehört es?</strong>",
        antworten: ["Iberia", "Suite Iberia"],
        tipp: "Die Tafel hängt an einer Hauswand am Platz. Das gesuchte Wort steht ganz am Ende der Inschrift.",
        loesung: "Iberia. Albéniz komponierte die Suite Iberia 1905–1908."
      }
    },
    {
      typ: "kultur", buchstabe: "O",
      name: "Corrala und Escuelas Pías",
      adresse: "Plaza de Arturo Barea, 28012 Madrid",
      meter: 193, minuten: 3,
      weg: "Verlasst den Platz über die Calle de Sombrerete nach Westen. Nach rund 130 m erreicht ihr die Plaza de la Corrala mit dem Haus voller offener Laubengänge. Gleich dahinter liegt die Plaza de Arturo Barea mit der großen Backsteinruine.",
      bild: { src: "bilder/02-arturo-barea.jpg", w: 1024, h: 681, alt: "Backsteinruine der Escuelas Pías mit Bibliotheksanbau, von oben gesehen",
              credit: "Escuelas Pías / Plaza de Agustín Lara · Foto: gaelx, Flickr, CC BY-SA 2.0" },
      info: [
        "Die <strong>Corrala</strong> an der Ecke Sombrerete/Mesón de Paredes ist das berühmteste Mietshaus Madrids: Wohnungen hinter offenen Laubengängen, die sich zum Hof öffnen. So lebten hier im 19. Jahrhundert die kleinen Leute, Tür an Tür und ohne Geheimnisse. 1977 wurde sie zum Nationaldenkmal erklärt.",
        "Die Ruine gegenüber war einmal eine der prächtigsten Kirchen der Stadt. Die Escolapios gründeten hier 1729 eine kostenlose Schule für arme Kinder und weihten 1791 eine Kuppelkirche ein. Im Juli 1936, zu Beginn des Bürgerkriegs, brannte alles aus. Heute steckt in den Mauern eine Universitätsbibliothek, und auch ein alter Uhrturm ist noch da.",
        "Merkt euch die kleine Tafel für <strong>Eloy Gonzalo</strong>, ein Findelkind aus dem Waisenhaus, das hier stand. Ihr begegnet ihm gleich wieder. Die Bronzefigur am Platz zeigt den mexikanischen Komponisten Agustín Lara, der Madrid ein Lied schrieb, bevor er die Stadt je gesehen hatte."
      ],
      aufgabe: "Am Platz hängt an einem niedrigen Backsteinturm eine alte Uhr mit römischen Ziffern. Ihre Zeiger stehen seit Langem still. <strong>Wie ist auf diesem Zifferblatt die Ziffer 4 geschrieben?</strong>",
      antworten: ["IIII", "iiii", "1111", "llll", "vier striche", "4 striche", "viermal i", "4 mal i"],
      tipp: "Der Turm steht an der Ecke des hellen Bibliotheksbaus. Sucht die Ziffer zwischen III und V.",
      loesung: "IIII, also vier Striche und nicht IV. Viele alte Turmuhren schreiben die Vier so.",
      planB: {
        aufgabe: "Uhr nicht zu sehen? Sucht am Platz die kleine Tafel für <strong>Eloy Gonzalo</strong>. <strong>In welchem Jahr wurde er laut Tafel geboren?</strong>",
        antworten: ["1868"],
        tipp: "Die Tafel hängt an einer Mauer am Platz, auf der Seite zur Calle del Mesón de Paredes. Die Jahreszahl steht am Ende des Textes.",
        loesung: "1868."
      }
    },
    {
      typ: "kultur", buchstabe: "M",
      name: "San Cayetano",
      adresse: "Calle de Embajadores 15, 28012 Madrid",
      meter: 310, minuten: 5,
      weg: "Folgt der Calle de Sombrerete weiter nach Westen bis zu ihrem Ende an der Calle de Embajadores (rund 85 m). Dort rechts und die Embajadores rund 225 m bergauf. Die Kirche erkennt ihr an der wuchtigen Steinfassade mit den Heiligenfiguren.",
      bild: { src: "bilder/03-san-cayetano.jpg", w: 1024, h: 400, alt: "Obere Fassade von San Cayetano mit drei Figurennischen",
              credit: "Iglesia de San Cayetano · Foto: Jose Javier Martin Espartosa, Flickr, CC BY-NC-SA 2.0 (Ausschnitt)" },
      info: [
        "Mitten in Lavapiés steht eine der schönsten Barockfassaden Madrids: die Kirche San Millán y San Cayetano. Gebaut wurde sie im frühen 18. Jahrhundert. Ein paar Schritte weiter erinnert eine Tafel daran, dass der Stadtbaumeister Pedro de Ribera hier wohnte. Ribera und Churriguera gelten als Väter des überschäumenden Madrider Barocks, des „Churriguerismo“.",
        "1936 brannte das Innere aus, die Fassade aus Granit und Backstein hielt stand. In drei reich verzierten Nischen stehen Steinfiguren. Jedes Jahr im August feiert das Viertel hier die Verbena de San Cayetano, ein Straßenfest mit Chotis und Limonada."
      ],
      aufgabe: "Schaut von oben nach unten. <strong>Wie viele rundbogige Portale (Eingänge) hat die Fassade auf Straßenhöhe?</strong>",
      antworten: ["3", "drei", "tres"],
      tipp: "Nicht die Nischen mit den Figuren zählen, sondern die großen Bögen darunter, durch die man hineingeht.",
      loesung: "3 Portale: ein großes in der Mitte und je eins links und rechts.",
      planB: {
        aufgabe: "Fassade eingerüstet? Sucht ein paar Schritte weiter die Tafel für den Architekten <strong>Pedro de Ribera</strong>. Sie nennt drei seiner Bauten. <strong>Welche Brücke ist dabei?</strong>",
        antworten: ["Puente de Toledo", "Toledo", "Toledobrücke", "Toledo-Brücke", "Brücke von Toledo"],
        tipp: "Die Tafel hängt an der Calle de Embajadores ganz in der Nähe der Kirche. Die Brücke ist nach einer Stadt benannt.",
        loesung: "Der Puente de Toledo über den Manzanares."
      }
    },
    {
      typ: "bar",
      name: "Taberna Antonio Sánchez",
      adresse: "Calle del Mesón de Paredes 13, 28012 Madrid",
      meter: 289, minuten: 4,
      weg: "Geht die Embajadores noch rund 40 m bergauf und biegt rechts in die Calle de los Abades (rund 160 m). An ihrem Ende links in die Calle del Mesón de Paredes. Nach rund 90 m steht ihr vor Nr. 13 mit der dunklen Holzfront.",
      bild: { src: "bilder/04-antonio-sanchez.jpg", w: 1024, h: 773, alt: "Dunkle Holzfassade der Taberna Antonio Sánchez",
              credit: "La taberna de Antonio Sánchez · Foto: francisco.j.gonzalez, Flickr, CC BY 2.0" },
      info: [
        "Zeit für den ersten Vermut. Nach Recherchen des Historikers Antonio Pasies reicht die Taberna bis 1787 zurück, damit wäre sie die älteste Madrids. 1884 übernahm sie ein Weinhändler aus La Mancha und gab ihr seinen Namen. Sein gleichnamiger Sohn machte sie zum Treffpunkt einer ganz bestimmten Szene.",
        "Ignacio Zuloaga malte hier, Pío Baroja und Gregorio Marañón saßen am Tresen. Die Theke ist mit Zinn beschlagen, die Kacheln sind original. Bestellt einen <em>vermut de grifo</em> vom Hahn, die Torrijas sind legendär."
      ],
      aufgabe: "Der Sohn, nach dem die Taberna heute heißt, hatte einen gefährlichen Beruf. Die Wände verraten ihn. <strong>Welchen?</strong>",
      antworten: ["Torero", "Stierkämpfer", "Stierkaempfer", "Matador", "Toreador", "Stierkampf"],
      tipp: "Schaut, wer euch da von den Wänden anstarrt. Es sind keine Menschen.",
      loesung: "Torero. Antonio Sánchez junior trat 1922 als Stierkämpfer an, die Stierköpfe an den Wänden stammen aus der Arena."
    },
    {
      typ: "kultur", buchstabe: "O",
      name: "Plaza de Cascorro",
      adresse: "Plaza de Cascorro, 28005 Madrid",
      meter: 318, minuten: 5,
      weg: "Folgt der Mesón de Paredes noch rund 30 m nach Norden und biegt links in die Calle de Juanelo. Nach rund 190 m erreicht ihr die Plaza de Cascorro. Das Denkmal steht dort, wo die Ribera de Curtidores beginnt. Diese Straße ist sonntags die Hauptachse des Flohmarkts Rastro.",
      bild: { src: "bilder/05-cascorro.jpg", w: 1024, h: 492, alt: "Bronzestatue eines Soldaten auf hohem Sockel an der Plaza de Cascorro",
              credit: "Eloy Gonzalo, Plaza de Cascorro · Foto: Miguel Ángel Prieto Ciudad, Flickr, CC BY-NC-SA 2.0 (Ausschnitt)" },
      info: [
        "Da ist er wieder: <strong>Eloy Gonzalo</strong>, das Findelkind aus der Inclusa von Lavapiés. 1896 kämpfte er als einfacher Soldat im kubanischen Unabhängigkeitskrieg. Spanische Truppen saßen im Dorf Cascorro fest, und Eloy meldete sich freiwillig: Er wollte ein von Aufständischen besetztes Haus anzünden. Damit man notfalls seinen Körper zurückziehen könnte, ließ er sich ein Seil umbinden. Er kam lebend zurück, starb aber 1897 an einer Krankheit.",
        "Madrid machte den Waisenjungen zum Volkshelden. Aniceto Marinas schuf die Bronzefigur, 1902 wurde sie eingeweiht. Seitdem heißt der Platz einfach „Cascorro“. Wer hier „en Cascorro“ verabredet ist, trifft sich am Rastro."
      ],

/* ============================================================
   ZUSTAND & SPEICHERUNG
   ============================================================ */
const SPEICHER_KEY = "madrid-rallye-v1";
const N = RALLYE.stationen.length;          // Index N = Schlussrätsel
const KULTUR = RALLYE.stationen.filter(s => s.typ === "kultur");

let S = leererZustand();

function leererZustand(){
  return { gestartet:false, i:0, phase:"weg", versuche:0, tippAn:false, aufgeloest:false,
           sterne:{}, uebersprungen:{}, planB:false };
}
function speichern(){
  try { localStorage.setItem(SPEICHER_KEY, JSON.stringify(S)); } catch(e){ /* privater Modus: ohne Wiederaufnahme */ }
}
function laden(){
  try {
    const roh = localStorage.getItem(SPEICHER_KEY);
    if(!roh) return null;
    const d = JSON.parse(roh);
    if(!d || typeof d.i !== "number" || d.i < 0 || d.i > N) return null;
    const z = Object.assign(leererZustand(), d);
    if(typeof z.sterne !== "object" || Array.isArray(z.sterne) || !z.sterne) z.sterne = {};
    if(typeof z.uebersprungen !== "object" || !z.uebersprungen) z.uebersprungen = {};
    return z;
  } catch(e){ return null; }
}
function speicherLoeschen(){ try { localStorage.removeItem(SPEICHER_KEY); } catch(e){} }

   tolerant: Groß/klein, Umlaute, Akzente, ñ, Satzzeichen, Leerzeichen,

   ============================================================ */
const ZAHLWORT = {
  null:0, zero:0, cero:0, eins:1, ein:1, eine:1, uno:1, una:1, zwei:2, dos:2, drei:3, tres:3,
  vier:4, cuatro:4, fuenf:5, cinco:5, sechs:6, seis:6, sieben:7, siete:7, acht:8, ocho:8,
  neun:9, nueve:9, zehn:10, diez:10, elf:11, once:11, zwoelf:12, doce:12, dreizehn:13, trece:13,
  vierzehn:14, catorce:14, fuenfzehn:15, quince:15, sechzehn:16, dieciseis:16, siebzehn:17,
  diecisiete:17, achtzehn:18, dieciocho:18, neunzehn:19, diecinueve:19, zwanzig:20, veinte:20
};
function norm(wert){
  let s = String(wert == null ? "" : wert).toLowerCase().trim()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const ART = /^(der|die|das|ein|eine|einen|einem|einer|dem|den|des|el|la|los|las|un|una|the|a|an)\s+/;
  for(let k = 0; k < 3 && ART.test(s); k++) s = s.replace(ART, "");
  s = s.replace(/\s/g,"");
  if(Object.prototype.hasOwnProperty.call(ZAHLWORT, s)) s = String(ZAHLWORT[s]);
  return s;
}
function istRichtig(eingabe, antworten){
  const n = norm(eingabe);
  return !!n && antworten.some(a => norm(a) === n);
}

/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */
function mapsUrl(adresse){
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(adresse) + "&travelmode=walking";
}
function absaetze(liste){ return liste.map(t => "<p>" + t + "</p>").join(""); }
function sterneText(n){ return "★".repeat(n) + "☆".repeat(3 - n); }
function kulturNr(i){ return RALLYE.stationen.slice(0, i + 1).filter(s => s.typ === "kultur").length; }
function buchstabenBis(i){  // Buchstaben aller Kulturstationen mit Index < i
  return RALLYE.stationen.slice(0, i).filter(s => s.typ === "kultur").map(s => s.buchstabe);
}
function sammlungHtml(anzahl){
  return `<ul class="sammlung">${KULTUR.map((x, k) =>
    `<li class="${k < anzahl ? "have" : ""}">${k < anzahl ? x.buchstabe : "?"}</li>`).join("")}</ul>`;
}
function bildHtml(b){
  if(!b) return "";
  if(b.platzhalter) return `<figure class="bild fehlt" role="img" aria-label="${b.alt}"><figcaption>${b.credit}</figcaption></figure>`;
  return `<figure class="bild"><img src="${b.src}" alt="${b.alt}" loading="lazy" width="${b.w}" height="${b.h}"
    onerror="this.parentNode.classList.add('fehlt')"><figcaption>${b.credit}</figcaption></figure>`;
}

/* ============================================================
   DARSTELLUNG
   ============================================================ */
const app = document.getElementById("app");
const actions = document.getElementById("actionsInner");
const dotsEl = document.getElementById("dots");
const labelEl = document.getElementById("topbarLabel");
const topbar = document.getElementById("topbar");

function kopfzeile(){
  if(!S.gestartet){ topbar.classList.add("hidden"); return; }
  topbar.classList.remove("hidden");
  labelEl.textContent = S.i === N ? "Schlussrätsel" : "Station " + (S.i + 1) + " / " + N;
  let html = "";
  for(let k = 0; k <= N; k++){
    const bar = k < N && RALLYE.stationen[k].typ === "bar" ? " bar" : "";
    html += `<span class="dot${bar}${k < S.i ? " done" : (k === S.i ? " now" : "")}"></span>`;
  }
  dotsEl.innerHTML = html;
}

function zeichne(){
  kopfzeile();
  if(!S.gestartet) screenStart();
  else if(S.phase === "ende") screenEnde();
  else if(S.i === N) (S.phase === "geloest" ? screenFinaleGeloest() : screenFinale());
  else if(S.phase === "weg") screenWeg();
  else if(S.phase === "ort") screenOrt();
  else if(S.phase === "raetsel") screenRaetsel();
  else if(S.phase === "geloest") screenGeloest();
  window.scrollTo(0, 0);
}

function screenStart(){
  const f = laden();
  const kannFortsetzen = !!(f && f.gestartet);
  app.innerHTML = `
    <p class="eyebrow">Stadtrallye Madrid</p>
    <h1>${RALLYE.titel}</h1>
    <p class="lead">${RALLYE.untertitel}</p>
    <ul class="meta">${RALLYE.eckdaten.map(e => "<li>" + e + "</li>").join("")}</ul>
    <div class="card">
      <h3>So läuft das</h3>
      <ol class="regeln">${RALLYE.regeln.map(r => "<li>" + r + "</li>").join("")}</ol>
    </div>
    <div class="card flat">
      <h3>Start</h3>
      <p>${RALLYE.start.text}</p>
      <a class="btn secondary" href="${mapsUrl(RALLYE.start.adresse)}" target="_blank" rel="noopener">Startpunkt in Google Maps</a>
    </div>
    <p class="footnote">${RALLYE.hinweis}</p>`;
  actions.innerHTML = kannFortsetzen
    ? `<button class="btn primary" data-tu="fortsetzen">Rallye fortsetzen</button>
       <button class="btn ghost" data-tu="neustart">Von vorn beginnen</button>`
    : `<button class="btn primary" data-tu="losgehts">Los geht's</button>`;
}

function eyebrow(st){
  return st.typ === "bar" ? "Station " + (S.i + 1) + " · Bar" : "Station " + (S.i + 1) + " · Kultur";
}

function screenWeg(){
  const st = RALLYE.stationen[S.i];
  app.innerHTML = `
    <p class="eyebrow">Weg zu Station ${S.i + 1}${st.typ === "bar" ? " · Bar" : ""}</p>
    <h2>${st.name}</h2>
    <ul class="meta"><li>${st.meter} m</li><li>ca. ${st.minuten} Min zu Fuß</li></ul>
    <div class="card"><h3>Der Weg</h3><p>${st.weg}</p></div>
    <div class="inline-actions">
      <a class="btn secondary" href="${mapsUrl(st.adresse)}" target="_blank" rel="noopener">In Google Maps öffnen</a>
    </div>
    <p class="footnote">Ziel: ${st.adresse}</p>`;
  actions.innerHTML = `<button class="btn primary" data-tu="angekommen">Wir sind da</button>`;
}

function screenOrt(){
  const st = RALLYE.stationen[S.i];
  app.innerHTML = `
    <p class="eyebrow">${eyebrow(st)}</p>
    <h2>${st.name}</h2>
    ${bildHtml(st.bild)}
    <div class="card">${absaetze(st.info)}</div>`;
  actions.innerHTML = `<button class="btn primary" data-tu="zumRaetsel">Zur Aufgabe</button>`;
}

function screenRaetsel(){
  const st = RALLYE.stationen[S.i];
  const a = aufgabeAktuell();
  const optional = st.typ === "bar";
  const pb = !!(S.planB && st.planB);
  app.innerHTML = `
    <p class="eyebrow">${eyebrow(st)}</p>
    <h2>${st.name}</h2>
    <div class="aufgabe${pb ? " planb" : ""}">
      <p class="eyebrow">${optional ? "Bonusfrage (freiwillig)" : (pb ? "Ersatzaufgabe (Plan B)" : "Eure Aufgabe")}</p>
      <p>${a.aufgabe}</p>
    </div>
    <div id="feedback"></div>
    <form id="antwortForm" autocomplete="off">
      <label class="fieldlabel" for="antwort">Eure Antwort</label>
      <input type="text" id="antwort" name="antwort" autocapitalize="off" autocorrect="off"
             spellcheck="false" enterkeyhint="go" placeholder="Hier eintippen">
    </form>
    <div class="inline-actions" style="margin-top:16px">
      <button class="btn ghost ${S.versuche >= 2 && !S.tippAn ? "" : "hidden"}" data-tu="tipp" id="tippBtn">Tipp anzeigen</button>
      <button class="btn ghost ${S.versuche >= 4 ? "" : "hidden"}" data-tu="aufloesen" id="aufloesenBtn">Lösung zeigen</button>
      ${optional ? `<button class="btn ghost" data-tu="ueberspringen">Ohne Bonusfrage weiter</button>` : ""}
      ${st.planB && !pb ? `<button class="btn ghost" data-tu="planb">Objekt nicht zu finden? Ersatzaufgabe</button>` : ""}
    </div>`;
  if(S.tippAn) zeigeTipp();
  actions.innerHTML = `<button class="btn primary" data-tu="pruefen">Antwort prüfen</button>`;
  document.getElementById("antwortForm").addEventListener("submit", ev => { ev.preventDefault(); pruefen(); });
}

function aufgabeAktuell(){
  if(S.i === N) return RALLYE.finale;
  const st = RALLYE.stationen[S.i];
  return (S.planB && st.planB) ? Object.assign({}, st, st.planB) : st;
}

function zeigeTipp(){
  const box = document.getElementById("feedback");
  if(!box) return;
  box.innerHTML = `<div class="feedback no"><strong>Tipp:</strong> ${aufgabeAktuell().tipp}</div>`;
  const b = document.getElementById("tippBtn"); if(b) b.classList.add("hidden");
}

function pruefen(){
  const feld = document.getElementById("antwort");
  const box = document.getElementById("feedback");
  if(!feld || !box) return;
  const st = aufgabeAktuell();
  if(!norm(feld.value)){ box.innerHTML = `<div class="feedback no">Da steht noch nichts im Feld.</div>`; return; }
  if(istRichtig(feld.value, st.antworten)){
    S.sterne[S.i] = S.tippAn ? 2 : 3;
    S.phase = "geloest"; speichern(); zeichne(); return;
  }
  S.versuche += 1; speichern(); feld.value = "";
  box.innerHTML = `<div class="feedback no">Nicht ganz. ${
    S.versuche < 2 ? "Schaut noch mal genau hin." :
    (S.versuche < 4 ? (S.tippAn ? "" : "Ein Tipp wartet unten.") : "Ihr könnt euch jetzt die Lösung zeigen lassen.")}</div>`;
  if(S.versuche >= 2 && !S.tippAn){ const t = document.getElementById("tippBtn"); if(t) t.classList.remove("hidden"); }
  if(S.versuche >= 4){ const a = document.getElementById("aufloesenBtn"); if(a) a.classList.remove("hidden"); }
  if(S.tippAn){ box.innerHTML += `<div class="feedback no"><strong>Tipp:</strong> ${st.tipp}</div>`; }
}

function screenGeloest(){
  const st = aufgabeAktuell();
  const skip = !!S.uebersprungen[S.i];
  const sterne = S.sterne[S.i] || 1;
  const naechste = S.i === N - 1 ? "Zum Schlussrätsel" : "Weiter zu Station " + (S.i + 2);
  let kopf;
  if(skip) kopf = `<div class="feedback ok"><p><strong>Prost!</strong> Die Bonusfrage habt ihr ausgelassen. ${st.loesung}</p></div>`;
  else kopf = `<div class="feedback ok"><p><strong>${S.aufgeloest ? "Die Lösung:" : "Richtig."}</strong> ${st.loesung}</p></div>
               <p class="sterne">${sterneText(sterne)}</p>`;
  let brief = "";
  if(st.typ === "kultur"){
    const nr = kulturNr(S.i);
    brief = `<div class="letter"><div class="big">${st.buchstabe}</div>
      <div class="txt">Sammelbuchstabe ${nr} von ${KULTUR.length}. Am Ende ergeben alle zusammen das Schlusswort.</div></div>
      ${sammlungHtml(nr)}`;
  }
  app.innerHTML = `
    <p class="eyebrow">Station ${S.i + 1} ${st.typ === "bar" ? "· Bar" : "gelöst"}</p>
    <h2>${st.name}</h2>${kopf}${brief}`;
  actions.innerHTML = `<button class="btn primary" data-tu="weiter">${naechste}</button>`;
}

function screenFinale(){
  const f = RALLYE.finale;
  app.innerHTML = `
    <p class="eyebrow">Schlussrätsel</p>
    <h2>${f.titel}</h2>
    ${sammlungHtml(KULTUR.length)}
    <div class="aufgabe"><p class="eyebrow">Eure Aufgabe</p><p>${f.aufgabe}</p></div>
    <div id="feedback"></div>
    <form id="antwortForm" autocomplete="off">
      <label class="fieldlabel" for="antwort">Das Schlusswort</label>
      <input type="text" id="antwort" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Hier eintippen">
    </form>
    <div class="inline-actions" style="margin-top:16px">
      <button class="btn ghost ${S.versuche >= 2 && !S.tippAn ? "" : "hidden"}" data-tu="tipp" id="tippBtn">Tipp anzeigen</button>
      <button class="btn ghost ${S.versuche >= 4 ? "" : "hidden"}" data-tu="aufloesen" id="aufloesenBtn">Lösung zeigen</button>
    </div>`;
  if(S.tippAn) zeigeTipp();
  actions.innerHTML = `<button class="btn primary" data-tu="pruefen">Antwort prüfen</button>`;
  document.getElementById("antwortForm").addEventListener("submit", ev => { ev.preventDefault(); pruefen(); });
}

function screenFinaleGeloest(){
  const f = RALLYE.finale;
  app.innerHTML = `
    <p class="eyebrow">Schlusswort</p>
    <h2>${f.wortAnzeige}</h2>
    <div class="feedback ok"><p><strong>${S.aufgeloest ? "Die Lösung:" : "Richtig."}</strong> ${f.loesung}</p></div>
    <p class="sterne">${sterneText(S.sterne[N] || 1)}</p>`;
  actions.innerHTML = `<button class="btn primary" data-tu="zumEnde">Auswertung ansehen</button>`;
}

function screenEnde(){
  const a = RALLYE.abschluss;
  const wertung = RALLYE.stationen.map((st, k) => ({st, k})).filter(x => x.st.typ === "kultur");
  const punkte = wertung.reduce((s, x) => s + (S.sterne[x.k] || 1), 0) + (S.sterne[N] || 1);
  const bonus = RALLYE.stationen.filter((st, k) => st.typ === "bar" && (S.sterne[k] || 0) >= 2 && !S.uebersprungen[k]).length;
  const zeilen = wertung.map(x => `<tr><td>${x.k + 1}. ${x.st.name}</td><td class="sterne">${sterneText(S.sterne[x.k] || 1)}</td></tr>`).join("")
    + `<tr><td>Schlusswort</td><td class="sterne">${sterneText(S.sterne[N] || 1)}</td></tr>`;
  app.innerHTML = `
    <p class="eyebrow">Geschafft</p>
    <h1>${a.titel}</h1>
    ${absaetze(a.text)}
    <div class="card"><h3>Eure Auswertung</h3>
      <table class="auswertung">${zeilen}</table>
      <p style="margin:14px 0 0"><strong>${punkte} von ${(KULTUR.length + 1) * 3} Sternen</strong>, dazu ${bonus} von ${N - KULTUR.length} Bar-Bonusfragen gelöst.</p>
    </div>
    <div class="card"><h3>Noch nicht genug?</h3>
      ${a.bonus.map(b => `<p><strong>${b.name}.</strong> ${b.text} <span class="klein">(${b.meter} m von hier)</span></p>
        <a class="btn secondary" href="${mapsUrl(b.adresse)}" target="_blank" rel="noopener">${b.name} in Google Maps</a>`).join('<div style="height:14px"></div>')}
    </div>`;
  actions.innerHTML = `<button class="btn ghost" data-tu="neustart">Rallye zurücksetzen</button>`;
}

/* ============================================================
   STEUERUNG
   ============================================================ */
function weiter(){
  S.i += 1; S.phase = S.i === N ? "raetsel" : "weg";
  S.versuche = 0; S.tippAn = false; S.aufgeloest = false; S.planB = false;
  speichern(); zeichne();
}
const HANDLER = {
  losgehts(){ speicherLoeschen(); S = leererZustand(); S.gestartet = true; speichern(); zeichne(); },
  fortsetzen(){ const d = laden(); if(d) S = d; zeichne(); },
  neustart(){
    if(!confirm("Wirklich von vorn beginnen? Der bisherige Fortschritt geht verloren.")) return;
    speicherLoeschen(); S = leererZustand(); zeichne();
  },
  angekommen(){ S.phase = "ort"; speichern(); zeichne(); },
  zumRaetsel(){ S.phase = "raetsel"; speichern(); zeichne(); },
  pruefen(){ pruefen(); },
  tipp(){ S.tippAn = true; speichern(); zeigeTipp(); },
  aufloesen(){ S.sterne[S.i] = 1; S.aufgeloest = true; S.phase = "geloest"; speichern(); zeichne(); },
  planb(){ S.planB = true; S.versuche = 0; S.tippAn = false; speichern(); zeichne(); },
  ueberspringen(){ S.uebersprungen[S.i] = true; S.phase = "geloest"; speichern(); zeichne(); },
  weiter(){ weiter(); },
  zumEnde(){ S.phase = "ende"; speichern(); zeichne(); }
};
document.addEventListener("click", ev => {
  const z = ev.target.closest("[data-tu]");
  if(!z) return;
  const h = HANDLER[z.getAttribute("data-tu")];
  if(h) h();
});

zeichne();
</script>
</body>
</html>
